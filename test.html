<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Kalkulator Service HP</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261015a">
<style>
:root {
  --text: #1a1a2e;
  --bg-2: #ffffff;
  --tap: #ffffff;
}
</style>
</head>
<body>
<div id="app">
  <div class="card">
    <div class="k-in-row">
      <label class="field k-in-half">
        <span class="lbl">Brand HP</span>
        <div class="sel-wrap">
          <select id="kBrand" aria-label="Brand HP"></select>
        </div>
      </label>
      <label class="field k-in-half">
        <span class="lbl">Seri HP</span>
        <div class="sel-wrap">
          <select id="kSeries" aria-label="Seri HP"></select>
        </div>
      </label>
    </div>
    <div class="k-in-row hidden" id="kBrandName" aria-hidden="true" tabindex="-1">
      <label class="field k-in-half">
        <span class="lbl">Brand manual</span>
        <input type="text" id="kBrandNameInput" placeholder="Brand manual">
      </label>
      <label class="field k-in-half">
        <span class="lbl">Seri manual</span>
        <input type="text" id="kSeriesNameInput" placeholder="Seri manual">
      </label>
    </div>
    <input type="text" id="kName" class="hidden" placeholder="Seri manual">
  </div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/tg.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/calc.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function() {
  if (window.CalcUI) {
    window.CalcUI.init();
  }
  
  // Test: pilih "Lainnya…" di seri HP
  setTimeout(function() {
    var kSeries = document.getElementById('kSeries');
    var kName = document.getElementById('kName');
    
    console.log('kSeries options:', kSeries.options.length);
    console.log('kName display sebelum:', kName.style.display || kName.className);
    
    // Pilih "Lainnya…"
    kSeries.value = '__custom__';
    kSeries.dispatchEvent(new Event('change'));
    
    console.log('kName display setelah:', kName.style.display || kName.className);
    console.log('kName visible:', kName.offsetParent !== null);
    
    // Visual feedback
    if (kName.offsetParent !== null) {
      document.body.innerHTML += '<div style="position:fixed;top:10px;right:10px;background:green;color:white;padding:10px;border-radius:8px;z-index:9999">✅ kName muncul!</div>';
    } else {
      document.body.innerHTML += '<div style="position:fixed;top:10px;right:10px;background:red;color:white;padding:10px;border-radius:8px;z-index:9999">❌ kName tidak muncul</div>';
    }
  }, 500);
});
</script>
</body>
</html>
