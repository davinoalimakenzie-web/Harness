<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Kalkulator Service HP</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261015a">
<style>
:root {
  --text: #1a1a2e;
  --bg-2: #ffffff;
  --tap: #ffffff;
  --line: #d0d3dd;
  --accent: #517da2;
  --bg-3: #e8eaf0;
  --text-2: #4a4a68;
}
body { padding: 20px; font-family: system-ui, sans-serif; }
.test-result {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 20px 30px;
  border-radius: 16px;
  font-size: 20px;
  font-weight: 700;
  z-index: 99999;
  box-shadow: 0 4px 20px rgba(0,0,0,.2);
  text-align: center;
  max-width: 90vw;
}
.test-pass { background: #22c55e; color: #fff; }
.test-fail { background: #ef4444; color: #fff; }
.test-info {
  background: #f0f2f5;
  padding: 15px;
  border-radius: 12px;
  margin: 15px 0;
  font-size: 14px;
  line-height: 1.6;
  word-break: break-all;
}
.test-info code {
  background: #e2e8f0;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
}
</style>
</head>
<body>

<div id="testResult" class="test-result" style="display:none"></div>

<div id="app">
  <div class="card">
    <div class="k-in-row">
      <label class="field k-in-half">
        <span class="lbl">Brand HP</span>
        <div class="sel-wrap">
          <select id="kBrand" aria-label="Brand HP"></select>
        </div>
      </label>
      <label class="field k-in-half">
        <span class="lbl">Seri HP</span>
        <div class="sel-wrap">
          <select id="kSeries" aria-label="Seri HP"></select>
        </div>
      </label>
    </div>
    <div class="k-in-row hidden" id="kBrandName" aria-hidden="true" tabindex="-1">
      <label class="field k-in-half">
        <span class="lbl">Brand manual</span>
        <input type="text" id="kBrandNameInput" placeholder="Brand manual">
      </label>
      <label class="field k-in-half">
        <span class="lbl">Seri manual</span>
        <input type="text" id="kSeriesNameInput" placeholder="Seri manual">
      </label>
    </div>
    <input type="text" id="kName" class="hidden" placeholder="Seri manual">
  </div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/tg.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/calc.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function() {
  if (window.CalcUI) {
    window.CalcUI.init();
  }
  
  // Test otomatis setelah 1 detik
  setTimeout(function() {
    var kSeries = document.getElementById('kSeries');
    var kName = document.getElementById('kName');
    var resultDiv = document.getElementById('testResult');
    
    // Info sebelum test
    var infoBefore = 'Opsi di dropdown Seri: ' + kSeries.options.length + '<br>';
    infoBefore += 'Isi dropdown: <code>' + kSeries.innerHTML.replace(/</g,'&lt;') + '</code><br>';
    infoBefore += 'kName display sebelum: <code>' + (kName.style.display || '(kosong)') + '</code><br>';
    infoBefore += 'kName hidden sebelum: <code>' + kName.classList.contains('hidden') + '</code>';
    
    // Simulasi klik "Lainnya…"
    kSeries.value = '__custom__';
    kSeries.dispatchEvent(new Event('change'));
    
    // Cek hasil
    var isVisible = kName.offsetParent !== null && kName.style.display !== 'none';
    var isHidden = kName.classList.contains('hidden');
    
    var infoSetelah = 'kName display setelah: <code>' + (kName.style.display || '(kosong)') + '</code><br>';
    infoSetelah += 'kName hidden setelah: <code>' + isHidden + '</code><br>';
    infoSetelah += 'kName offsetParent: <code>' + (kName.offsetParent ? 'ADA' : 'NULL') + '</code>';
    
    if (isVisible && !isHidden) {
      resultDiv.className = 'test-result test-pass';
      resultDiv.innerHTML = '✅ BERHASIL!<br><small>Kolom input muncul saat pilih Lainnya…</small>';
    } else {
      resultDiv.className = 'test-result test-fail';
      resultDiv.innerHTML = '❌ GAGAL!<br><small>Kolom input tidak muncul</small>';
    }
    resultDiv.style.display = 'block';
    
    // Tampilkan info detail di halaman
    var infoDiv = document.createElement('div');
    infoDiv.className = 'test-info';
    infoDiv.innerHTML = '<strong>Sebelum klik:</strong><br>' + infoBefore + '<br><strong>Setelah klik:</strong><br>' + infoSetelah;
    document.body.appendChild(infoDiv);
  }, 1000);
});
</script>
</body>
</html>
