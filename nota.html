<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#517da2">
<meta name="robots" content="noindex, nofollow">
<title>Nota Service — Mas Cim Service HP</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261006b">
</head>
<body>

<!--
  Halaman nota pelanggan yang dibuka dari link.

  Dua jenis tautan yang bisa dibuka di sini:
    1. LINK MANDIRI  (#/s/<data>) - isi nota ikut di dalam tautannya, jadi
       bisa dibuka dari HP mana pun, jaringan apa pun, tanpa server. Isinya
       sudah disaring sejak dibuat (lihat encodePublicNote di mascim-local.js).
    2. LINK TOKEN    (#/nota/<token>) - isinya dibaca dari perangkat tempat
       nota dibuat, dan bisa dicabut pemiliknya.

  Dua sifat yang dijaga di halaman ini:
    1. BACA SAJA. Tidak ada tombol yang bisa mengubah data apa pun, dan
       halaman ini tidak memuat modul aplikasi (Store/Tx/Mascim UI), jadi
       tidak ada jalan untuk menulis dari sini.
    2. TEPAT ISI YANG BOLEH. Yang ditampilkan hanya field yang sudah
       diizinkan keluar. PIN/pola layar, modal sparepart, Dana Bank, dan
       catatan internal tidak pernah ikut - baik di link token maupun di
       link mandiri.
-->
<div class="mc-public">
  <div class="mc-public-box">
    <div class="mc-public-brand">MAS CIM SERVICE HP</div>
    <div class="mc-public-sub">Nota Service Pelanggan &middot; baca saja</div>
    <div class="mc-public-box-body">
      <p class="mc-hint" id="pLoading">Memuat nota&hellip;</p>
    </div>
  </div>
</div>

<script src="assets/js/mascim-local.js"></script>
<script src="assets/js/supabase.js"></script></script>
<script>
(function () {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function rupiah(n) {
    return 'Rp' + Number(n || 0).toLocaleString('id-ID');
  }
  function tgl(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d)) return '-';
    return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' }) +
      ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }
  // Nomor WhatsApp ditampilkan sebagian saja: link nota bisa diteruskan.
  function waSamar(wa) {
    var s = String(wa || '').replace(/[\s-]/g, '');
    if (s.length <= 6) return s;
    return s.slice(0, 5) + '*****' + s.slice(-3);
  }
  function kv(k, v) {
    return '<div class="mc-kv"><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>';
  }

  function body() { return document.querySelector('.mc-public-box-body'); }

  function gagal(pesan) {
    // Bedakan sebab gagalnya supaya laporan dari pelanggan langsung
    // mengarah ke masalahnya, bukan sekadar "link rusak".
    var alamat = String(window.location.href || '');
    var p1 = alamat.split('#')[0];
    var tanya = p1.indexOf('?') >= 0 ? p1.slice(p1.indexOf('?') + 1) : '';
    var keterangan;
    if (!tanya) {
      keterangan = 'Tautan ini tidak membawa isi nota sama sekali.';
    } else {
      var nama = tanya.split('=')[0];
      var nilai = tanya.split('=').slice(1).join('=');
      keterangan = 'Bagian "' + nama + '" berisi ' + nilai.length +
        ' karakter' + (nilai.length < 20 ? ', seharusnya jauh lebih panjang.' : '.');
    }
    body().innerHTML =
      '<div class="mc-noterevoked" style="margin-top:8px">' +
        '<b>Nota tidak bisa ditampilkan</b>' +
        '<span>' + esc(pesan) + '</span>' +
        '<span style="display:block;margin-top:10px;font-size:12px;opacity:.75">' +
          esc(keterangan) + '</span></div>' +
      '<p class="mc-public-foot">Bila ini keliru, hubungi Mas Cim Service HP. ' +
        'Sebutkan keterangan di atas supaya bisa ditelusuri.</p>';
  }

  // Isi nota. Sengaja dibangun ulang di sini (bukan memakai modul UI) supaya
  // halaman ini benar-benar terpisah dari aplikasi internal: tidak ada kode
  // yang bisa ikut MEMUAT data di luar daftar putih di bawah.
  /* Isi nota yang dilihat pelanggan.

       Hanya delapan hal ini yang boleh muncul:
         no. nota, nama, WhatsApp, unit, penanganan, total biaya,
         garansi, tanggal pengambilan.

       PENTING: harga part / modal sparepart TIDAK PERNAH ikut. Yang tampil
       dari sparepart juga dihapus supaya tidak ada yang bisa disalahartikan
       sebagai harga. */
  function htmlNota(n) {
      var h = '<div class="mc-note-doc">';
      h += '<div class="mc-note-doc-head">' +
        '<div><span>Nota Service</span><b>#' + esc(n.numberLabel) + '</b></div>' +
      '</div>';

      h += '<div class="mc-sec">Pelanggan &amp; Unit</div>' +
        kv('Nama', n.customerName) +
        kv('Unit', n.device) +
        (n.whatsapp ? kv('WhatsApp', waSamar(n.whatsapp)) : '');

      h += '<div class="mc-sec">Penanganan</div>' +
        kv('Penanganan akhir', n.handling || 'Tidak ada penanganan tambahan');

      h += '<div class="mc-sec">Biaya &amp; Garansi</div>' +
        '<div class="mc-money big"><div><span>Total Biaya</span><b>' + rupiah(n.totalCost) + '</b></div></div>' +
        // Metode pembayaran ikut ditampilkan sebagai bukti konkret untuk
        // laporan admin. Nota lama yang belum punya metode tetap tampil
        // lengkap; hanya baris ini yang kosong.
        (n.paymentMethod
          ? kv('Metode Pembayaran', n.paymentMethod) +
            kv('Status Pembayaran', n.paidAt ? 'Lunas · ' + tgl(n.paidAt) : 'Belum lunas')
          : '') +
        kv('Masa Garansi', n.warrantyDays + ' hari · berlaku sampai ' + tgl(n.warrantyUntil)) +
        kv('Tanggal Pengambilan', n.takenAt ? tgl(n.takenAt) : 'Belum diambil');

      // Nomor pusat pengirim. Pelanggan menghubungi nomor usaha yang
      // tetap, bukan nomor admin yang kebetulan mengirim tautan.
      if (n.pusatTelp) {
        h += '<div class="mc-sec">Kontak</div>' +
          kv('Pengirim nota', (n.usahaNama || 'Mas Cim Service HP')) +
          kv('Nomor pusat', n.pusatTelp);
      }

      h += '</div>';
      return h;
    }

  // Nomor tujuan WhatsApp adalah nomor pusat, bukan nomor pelanggan.
  function waPusat(n) {
    var nomor = String(n.pusatTelp || '').replace(/[^0-9]/g, '');
    if (nomor.charAt(0) === '0') nomor = '62' + nomor.slice(1);
    var teks = 'Halo ' + (n.usahaNama || 'Mas Cim Service HP') +
      ', saya pelanggan Nota Service #' + n.numberLabel +
      (n.device ? ' (' + n.device + ')' : '') + '.';
    return 'https://wa.me/' + nomor + '?text=' + encodeURIComponent(teks);
  }

  function tampil(n) {
    if (n.revoked) {
      gagal('Link nota ini sudah dicabut oleh Mas Cim Service HP, jadi isinya tidak lagi ditampilkan.');
      return;
    }
    // Kedaluwarsa checked server, jadi tidak bisa dilewati dengan
    // Memoctor. Non Garansi punya expires_at kosong dan tidak pernah
    // masuk ke sini.
    if (n.expired) {
      gagal('Masa berlaku nota ini sudah habis. Hubungi Mas Cim Service HP bila masih ada yang perlu ditanyakan.');
      return;
    }
    var h = '<div class="mc-pad">' + htmlNota(n) + '</div>';
    h += '<div class="mc-public-actions">' +
      (n.pusatTelp
        ? '<a class="mc-primary mc-publik-wa" href="' + waPusat(n) + '" '
          + 'target="_blank" rel="noopener">Hubungi via WhatsApp</a>'
        : '') +
      '<button class="mc-primary" id="pPrint">Cetak / PDF</button>' +
    '</div>';
    // Masa berlaku tautan dinyatakan terbuka supaya pelanggan tidak
    // bingung mengira nota sudah hilang.
    h += '<p class="mc-public-foot">Nota ini bersifat baca saja. ' +
      'Masa garansi berlaku ' + n.warrantyDays + ' hari sejak tanggal terbit.' +
      (n.linkUntil ? ' Tautan ini berlaku sampai ' + tgl(n.linkUntil) + '.' : '') +
      '</p>';
    body().innerHTML = h;
    var b = document.getElementById('pPrint');
    if (b) b.addEventListener('click', function () { window.print(); });
  }

  // Token diambil dari hash (#/nota/<token>) supaya URL tetap bersih.
  function tokenDariUrl() {
    var h = String(window.location.hash || '');
    var m = h.match(/#\/nota\/([A-Za-z0-9]+)/);
    if (m) return m[1];
    var q = String(window.location.search || '').match(/[?&]t=([A-Za-z0-9]+)/);
    return q ? q[1] : '';
  }

  // Tautan mandiri: isi nota ikut di dalam URL (#/s/<data>), jadi halaman ini
  // bisa menampilkannya tanpa data dari perangkat mana pun. Dipakai supaya
  // nota garansi tetap bisa dibuka dari HP mana pun.
  function mandiriDariUrl() {
    var h = String(window.location.hash || '');
    var m = h.match(/#\/s\/([A-Za-z0-9_-]+)/);
    if (m) return m[1];
    var q = String(window.location.search || '').match(/[?&]s=([A-Za-z0-9_-]+)/);
    return q ? q[1] : '';
  }

  function muat() {
    var mandiri = mandiriDariUrl();
    if (mandiri) {
      if (!window.MascimLocal) { gagal('Mesin data tidak termuat.'); return; }
      try {
        tampil(window.MascimLocal.decodePublicNote(mandiri));
      } catch (e) {
        gagal(e && e.message ? e.message : 'Tautan nota tidak terbaca.');
      }
      return;
    }
    var token = tokenDariUrl();
    if (!token) {
      gagal('Tautan nota tidak lengkap. Buka link persis seperti yang dikirim Mas Cim Service HP.');
      return;
    }

    // Sumber pertama: Supabase. Berisi nota lengkap dan tidak bergantung
    // pada perangkat mana pun, jadi pelanggan cukup punya tautannya.
    if (window.Supa && window.Supa.ambilNota) {
      tampilWait();
      window.Supa.ambilNota(token).then(function (b) {
        tampil(dariBaris(b));
      }).catch(function (e) {
        // Server tidak bisa dihubungi, atau nota memang tidak ada di
        // sana. Coba perangkat ini sebagai cadangan, supaya nota lama
        // yang baru saja terbit tetap bisa dibuka di HP Mas Cim.
        if (window.MascimLocal) {
          try {
            tampil(window.MascimLocal.getPublicNoteByToken(token));
            return;
          } catch (e2) { /* lanjut ke pesan gagal */ }
        }
        gagal(e && e.message ? e.message : 'Nota tidak ditemukan.');
      });
      return;
    }

    if (!window.MascimLocal) { gagal('Mesin data tidak termuat.'); return; }
    try {
      tampil(window.MascimLocal.getPublicNoteByToken(token));
    } catch (e) {
      gagal(e && e.message ? e.message : 'Nota tidak ditemukan.');
    }
  }

  // Bentuk nota dari baris Supabase. Hanya kolom putih yang dipakai,
  // jadi tidak ada harga part atau modal yang bisa bocor.
  function dariBaris(b) {
    var hari = Number(b.warranty_days || 0);
    return {
      numberLabel: nomer(b.no_nota),
      token: b.token,
      customerName: b.customer_name || '',
      whatsapp: b.whatsapp || '',
      device: b.device || '',
      complaint: b.complaint || '',
      intakeCondition: b.intake_condition || '',
      handling: b.handling || '',
      totalCost: Number(b.total_cost || 0),
      paymentMethod: b.payment_method || '',
      paidAt: b.paid_at || '',
      warrantyLabel: b.warranty || 'Non Garansi',
      warrantyDays: hari,
      warrantyUntil: b.warranty_until || '',
      takenAt: b.taken_at || '',
      revoked: !!b.dicabut,
      expired: !!(b.expires_at && new Date(b.expires_at).getTime() < Date.now()),
      // Nomor pusat dan nama usaha ikut memakai bawaan supaya halaman nota
      // yang dilayani server juga punya tombol menghubungi.
      pusatTelp: window.MascimLocal
        ? window.MascimLocal.NOTA_TELP_PUSAT : '08976990006',
      usahaNama: window.MascimLocal
        ? window.MascimLocal.NOTA_NAMA_USAHA : 'Mas Cim Service HP',
      // Masa berlaku tautan mengikuti masa garansi yang tersimpan di server.
      linkUntil: b.expires_at || b.warranty_until || ''
    };
  }

  function nomer(v) {
    var n = String(Number(v || 0));
    while (n.length < 4) n = '0' + n;
    return n;
  }

  function tampilWait() {
    var d = body();
    if (!d) return;
    d.innerHTML = '<p class="mc-empty">Memuat nota dari server...</p>';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', muat);
  } else {
    muat();
  }
})();
</script>
</body>
</html>
